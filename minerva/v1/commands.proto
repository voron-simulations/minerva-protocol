syntax = "proto3";

package minerva.v1;

import "minerva/v1/common.proto";

option csharp_namespace = "Minerva.Protocol";

message MoveCommand {
  Position position = 1;
  string group_id = 2;
}

message SearchAndDestroyCommand {
  Position position = 1;
  string group_id = 2;
}

message DefendZoneCommand {
  string group_id = 1;
  string zone_id = 2;
  optional Position position = 3; // specific position within the zone
}

message PatrolCommand {
  string group_id = 1;
  repeated Position waypoints = 2;
  bool loop = 3; // whether to loop through waypoints
}

message SupportCommand {
  string supporter_group_id = 1;
  string supported_group_id = 2;
  string support_type = 3; // "resupply", "medical", "repair", etc.
}

enum CommandResult {
  COMMAND_RESULT_UNSPECIFIED = 0;
  COMMAND_RESULT_SUCCESS = 1;
  COMMAND_RESULT_FAILURE = 2;
}

message SendCommandRequest {
  oneof command {
    MoveCommand move = 1;
    SearchAndDestroyCommand search_and_destroy = 2;
    DefendZoneCommand defend_zone = 3;
    PatrolCommand patrol = 4;
    SupportCommand support = 5;
  }
}

message SendCommandResponse {
  CommandResult result = 1;
  string reason = 2;
}

service CommandService {
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse);
}
